# Nginx 配置 — MyQuant Web App
# 放置路径: /etc/nginx/sites-available/myquant
# 启用命令: ln -s /etc/nginx/sites-available/myquant /etc/nginx/sites-enabled/myquant

server {
    listen 80;
    server_name _;  # 匹配任意域名/IP，有域名时改为实际域名

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # 上传限制（用于数据同步等接口）
    client_max_body_size 50m;

    # 超时（回测可能耗时较长）
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # 所有请求代理到 Next.js（Next.js 内部已将 /api/* rewrite 到 FastAPI）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
